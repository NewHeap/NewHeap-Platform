<div class="{{modalClass}}">
  <div class="row">
    <div class="col-12">
      <p [innerHTML]="message"></p>
    </div>
  </div>
  <div class="row">
    <div class="col-12">
      <ng-container *ngIf="errorResult && !errorResult?.isSuccess">
        <div class="alert alert-danger" role="alert">
          <b>Er is een fout opgetreden</b>
          <ul>
            <ng-container *ngFor="let resultItem of errorResult.items">
              <li *ngFor="let resultItemErrorMsg of resultItem.errorMessages">{{ resultItemErrorMsg }}</li>
            </ng-container>
          </ul>
        </div>
      </ng-container>
    </div>
  </div>
  <div class="row">
    <div class="col-12 text-end">
      <button [disabled]="allBtnsDisabled || btnCancelDisabled" class="btn btn-danger me-2" (click)="cancel()">{{ btnCancelText | translate  }}</button>
      <button [disabled]="allBtnsDisabled || btnConfirmDisabled" class="btn btn-success" (click)="confirm()">{{ btnConfirmText | translate }}</button>
    </div>
  </div>
</div>
