<div class="row">
  <p class="mt-2 text-center" *ngIf="description">{{ description }}</p>
  <div class="row text-center mt-3 mb-3">
    <div class="col-12">
      <button *ngIf="showCancel()" (click)="closeDialog()" class="bg-light-grey medium gradient icon-bg me-2">
        <svg class="fa-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M393.4 41.37C405.9 28.88 426.1 28.88 438.6 41.37C451.1 53.87 451.1 74.13 438.6 86.63L269.3 255.1L438.6 425.4C451.1 437.9 451.1 458.1 438.6 470.6C426.1 483.1 405.9 483.1 393.4 470.6L223.1 301.3L54.63 470.6C42.13 483.1 21.87 483.1 9.372 470.6C-3.124 458.1-3.124 437.9 9.372 425.4L178.7 255.1L9.372 86.63C-3.124 74.13-3.124 53.87 9.372 41.37C21.87 28.88 42.13 28.88 54.63 41.37L223.1 210.7L393.4 41.37z"/></svg>
        {{ cancelText() }}
      </button>
      <button *ngIf="showConfirm()" (click)="confirmed.emit();closeDialog()" class="bg-green medium gradient font-white icon-bg">
        <svg class="fa-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M438.6 105.4C451.1 117.9 451.1 138.1 438.6 150.6L182.6 406.6C170.1 419.1 149.9 419.1 137.4 406.6L9.372 278.6C-3.124 266.1-3.124 245.9 9.372 233.4C21.87 220.9 42.13 220.9 54.63 233.4L159.1 338.7L393.4 105.4C405.9 92.88 426.1 92.88 438.6 105.4H438.6z"/></svg>
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
