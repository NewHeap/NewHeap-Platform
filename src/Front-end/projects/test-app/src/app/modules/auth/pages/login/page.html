<form #appForm="ngForm" (ngSubmit)="onSubmit($event)" class="text-left">
  <div class="row">
    <div class="col">
      <div class="form-group required">
        <label>{{ 'general.username'|translate }}</label>
        <input class="form-control" type="email" name="username"
               [readonly]="isSubmitting"
               [(ngModel)]="formData.username"/>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div class="form-group required">
        <label>{{ 'general.password'|translate }}</label>
        <input class="form-control" type="password" name="password"
               [readonly]="isSubmitting"
               [(ngModel)]="formData.password"/>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn-primary"
          (click)="onSubmit($event)">{{ 'general.sign-in' | translate }}
  </button>
</form>
