name: Bootstrap npm AI chat package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-npm-ai-chat
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main'
    environment: public-package-bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Check out dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify immutable main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Bootstrap publication must use the current main commit." >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
          scope: '@newheap'
      - name: Verify unused target and pinned bootstrap version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(node tools/release/release-info.mjs --component npm-ai-chat --field version)" != "0.1.0" ]]; then
            echo "The temporary bootstrap workflow is pinned to npm-ai-chat 0.1.0." >&2
            exit 1
          fi
          node tools/release/verify-public-release-targets.mjs \
            --component npm-ai-chat \
            --version 0.1.0 \
            --require-missing
      - name: Install Angular workspace dependencies
        run: npm ci
        working-directory: src/Front-end
      - name: Audit npm runtime dependencies
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high
        working-directory: src/Front-end
      - name: Validate release contract
        run: |
          npm run release:test
          npm run skills:validate
      - name: Pack verified bootstrap artifact
        run: |
          node tools/release/package-release.mjs \
            --component npm-ai-chat \
            --version 0.1.0 \
            --output release-artifacts/npm-ai-chat \
            --repository-url "https://github.com/${{ github.repository }}" \
            --commit "$GITHUB_SHA"
      - name: Publish first public package version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish release-artifacts/npm-ai-chat/*.tgz --access public --registry https://registry.npmjs.org
      - name: Verify anonymous public availability
        run: |
          node tools/release/verify-public-release-targets.mjs \
            --component npm-ai-chat \
            --version 0.1.0

